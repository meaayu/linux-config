
[bar]
position = "bottom" # "top" or "bottom"
spacing = 8
size = 35
popover_offset = 20
background_opacity = 1.0

[widgets]
left = ["workspaces", "window_title"]
center = ["clock"]
right = [
  "tray",
  "notifications",
  "quick_settings",
  "battery",
  "custom-power",
]
border_radius = 40
background_opacity = 1.0

[widgets.quick_settings]
vpn = false
updates = false

[widgets.custom-power]
icon = "system-shutdown-symbolic"
label = ""
tooltip = "Power menu"
on_click = "anyrun"
on_click_right = ""

[theme]
mode = "gtk" # "auto", "dark", "light", "gtk"

[theme.icons]
theme = "gtk" # "material" or "gtk"
weight = 400       # Material icon stroke weight (100-700)

[osd]
enabled = true
position = "bottom" # "bottom", "top", "left", "right"

[advanced]
compositor = "auto"  # "auto", "hyprland", "niri", "mango"

# Custom CSS: place style.css in same directory as this file.
# See documentation for available CSS variables and classes.
