# Kape Starship Config
# A minimal prompt rooted in coffee, earth, and amber.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = true

palette = "kape"

[palettes.kape]
background  = "#181616"
surface     = "#1e1b1b"
foreground  = "#d4be98"
second_text = "#bdae8b"
muted       = "#928374"
red         = "#b53535"
green       = "#b4c76e"
yellow      = "#e7bb5c"
blue        = "#7b8fd4"
purple      = "#b06880"
aqua        = "#689d8a"
orange      = "#c87941"
white       = "#c2c2c2"

# ── Directory ────────────────────────────────────────────────────────
[directory]
style = "bold fg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"~" = "󰋜 ~"

# ── Git ──────────────────────────────────────────────────────────────
[git_branch]
style = "fg:aqua"
format = "[  $branch ]($style)"
truncation_length = 20
truncation_symbol = "…"

[git_status]
style = "fg:muted"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead      = "⇡$count "
behind     = "⇣$count "
diverged   = "⇕ "
untracked  = "? "
stashed    = "󰏗 "
modified   = "! "
staged     = "+ "
renamed    = "» "
deleted    = "✘ "

# ── Fill (middle spacer) ─────────────────────────────────────────────
[fill]
symbol = " "

# ── Command duration ─────────────────────────────────────────────────
[cmd_duration]
style = "fg:muted"
format = "[ 󱎫 $duration ]($style)"
min_time = 2_000

# ── Prompt character ─────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:green)"
error_symbol   = "[❯](bold fg:red)"
vimcmd_symbol  = "[❮](bold fg:yellow)"

# ── Disabled modules ─────────────────────────────────────────────────
[package]
disabled = true

[username]
disabled = true

[hostname]
disabled = true